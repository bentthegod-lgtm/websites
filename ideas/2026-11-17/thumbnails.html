<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Inter','DejaVu Sans',sans-serif}
#c{position:absolute;inset:0}
#ov{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;top:44px;left:56px;padding:14px 30px;border-radius:999px;font-weight:900;font-size:40px;letter-spacing:2px;color:#111;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.num{position:absolute;top:36px;right:56px;width:110px;height:110px;border-radius:50%;background:#fff;color:#111;font-weight:900;font-size:76px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.box{position:absolute;left:56px;bottom:52px;max-width:1180px}
.name{font-weight:900;font-size:150px;line-height:.95;color:#fff;letter-spacing:-2px;
 -webkit-text-stroke:10px #111;paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.45);margin-bottom:18px}
.hook{display:inline-block;font-weight:800;font-size:52px;color:#111;padding:10px 26px;border-radius:18px;margin-bottom:22px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.bul{font-weight:800;font-size:44px;color:#fff;line-height:1.28;-webkit-text-stroke:7px #111;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.bul span{display:inline-block;width:52px}
.shade{position:absolute;left:0;bottom:0;width:1400px;height:760px;background:radial-gradient(ellipse at 0% 100%,rgba(0,0,0,.62),rgba(0,0,0,0) 70%)}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ov"><div class="shade"></div><div class="tag" id="tag"></div><div class="num" id="num"></div>
<div class="box"><div class="name" id="name"></div><div class="hook" id="hook"></div><div class="bul" id="bul"></div></div></div>
<script src="three.min.js"></script>
<script>
const IDEAS={
1:{name:'TRASH<br>TITAN',hook:'Grab the trash. Crush it. Get rich.',acc:'#7dff6a',tag:'GARBAGE TYCOON',
 bul:['Drive your garbage truck around town','Crush, sort and recycle for cash','Upgrade to mega trucks and a landfill empire']},
2:{name:'TANK<br>SCRUB',hook:'The giant aquarium is FILTHY.',acc:'#5ad1ff',tag:'CLEANING SIM',
 bul:['Scrub algae and vacuum the gravel','Rescue rare fish as the water clears','Unlock bigger tanks: shark, squid, whale']},
3:{name:'PRESENT<br>TOWER',hook:'Stack it high. Knock theirs down!',acc:'#ff4d4d',tag:'STACK BATTLE',
 bul:['Catch falling presents and stack them','Tallest tower when time runs out wins','Throw snowballs at your rivals\' towers']},
4:{name:'PILLOW<br>BRAWL',hook:'Sleepover rules: NO MERCY.',acc:'#c89bff',tag:'RAGDOLL PVP',
 bul:['Bonk friends with giant pillows','Feather explosions send them flying','Unlock mega pillows and pajamas']},
5:{name:'TOPPLE',hook:'Set up 10,000 dominoes. Push ONE.',acc:'#ffd23b',tag:'CHAIN REACTION',
 bul:['Build huge domino runs with friends','Add ramps, bells, rockets and traps','Watch the whole map fall down']},
};
const id=+(new URLSearchParams(location.search).get('i')||1);const I=IDEAS[id];
document.getElementById('name').innerHTML=I.name;document.getElementById('hook').textContent=I.hook;
document.getElementById('hook').style.background=I.acc;document.getElementById('tag').textContent=I.tag;
document.getElementById('tag').style.background=I.acc;document.getElementById('num').textContent=id;
document.getElementById('bul').innerHTML=I.bul.map(b=>'<div><span>▶</span>'+b+'</div>').join('');

const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setSize(1920,1080,false);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();const cam=new THREE.PerspectiveCamera(50,1920/1080,0.1,2000);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0},o));
function box(w,h,d,c,x,y,z,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function sph(r,c,x,y,z,o){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function cyl(r1,r2,h,c,x,y,z,o){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,16),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
// blocky avatar; pose: 'run','cheer','throw','scared','sit'
function avatar(x,y,z,ry,shirt,pants,pose='run',skin=0xf5c542){
 const g=new THREE.Group();const P=(w,h,d,c,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(px,py,pz);m.castShadow=true;g.add(m);return m};
 P(2,2,1,shirt,0,3,0);const hd=P(1.2,1.2,1.2,skin,0,4.65,0);
 const e1=new THREE.Mesh(new THREE.BoxGeometry(.18,.28,.05),mat(0x111111));e1.position.set(-.25,4.75,.61);g.add(e1);const e2=e1.clone();e2.position.x=.25;g.add(e2);
 const mo=new THREE.Mesh(new THREE.BoxGeometry(pose==='scared'?.35:.5,pose==='scared'?.3:.1,.05),mat(0x111111));mo.position.set(0,4.35,.61);g.add(mo);
 const arm=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(skin));m.position.y=-.9;m.castShadow=true;a.add(m);a.position.set(s*1.5,3.9,0);g.add(a);return a};
 const leg=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(pants));m.position.y=-1;m.castShadow=true;a.add(m);a.position.set(s*.5,2,0);g.add(a);return a};
 const la=arm(-1),ra=arm(1),ll=leg(-1),rl=leg(1);
 if(pose==='run'){la.rotation.x=1;ra.rotation.x=-1;ll.rotation.x=-.7;rl.rotation.x=.7;g.rotation.x=.15}
 if(pose==='cheer'){la.rotation.z=-2.6;ra.rotation.z=2.6}
 if(pose==='throw'){ra.rotation.x=-2.6;la.rotation.x=.6;ll.rotation.x=-.4;rl.rotation.x=.4}
 if(pose==='scared'){la.rotation.x=-2.2;ra.rotation.x=-2.2;la.rotation.z=-.3;ra.rotation.z=.3}
 if(pose==='sit'){ll.rotation.x=-1.4;rl.rotation.x=-1.4;la.rotation.x=-1.0;ra.rotation.x=-1.0}
 g.position.set(x,y,z);g.rotation.y=ry;S.add(g);return g}
function sun(c,i,x,y,z){const d=new THREE.DirectionalLight(c,i);d.position.set(x,y,z);d.castShadow=true;d.shadow.mapSize.set(2048,2048);const s=d.shadow.camera;s.left=-120;s.right=120;s.top=120;s.bottom=-120;s.far=600;S.add(d);return d}
function skyGrad(top,bot){const cv=document.createElement('canvas');cv.width=2;cv.height=256;const x=cv.getContext('2d');const gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,top);gr.addColorStop(1,bot);x.fillStyle=gr;x.fillRect(0,0,2,256);S.background=new THREE.CanvasTexture(cv)}
function pine(x,z,s=1,c=0x2f6b3a,snow=false){cyl(.6*s,.8*s,3*s,0x6b4423,x,1.5*s,z);for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.ConeGeometry((4-i)*s,4*s,8),mat(c));m.position.set(x,(4+i*2.4)*s,z);m.castShadow=true;S.add(m);if(snow){const n=new THREE.Mesh(new THREE.ConeGeometry((2.6-i*.6)*s,2*s,8),mat(0xffffff));n.position.set(x,(5.2+i*2.4)*s,z);S.add(n)}}}
let seed=id*99;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;



function road(len,w,x,z,ry,c){const r=box(w,.4,len,c||0x3a3a44,x,.2,z);r.rotation.y=ry||0;for(let i=-len/2;i<len/2;i+=10){const d=box(.6,.42,5,0xffffff,0,0,0);S.remove(d);d.position.set(0,.01,i);r.add(d)}return r}







function figure(c){const a=avatar(0,0,0,0,c,0x222244,'cheer');S.remove(a);return a}









if(id===1){ // trash titan
 skyGrad('#4aa0ff','#d8f0ff');S.fog=new THREE.Fog(0xd8f0ff,180,520);
 S.add(new THREE.HemisphereLight(0xffffff,0x6a7a5a,1.0));sun(0xfff4e0,1.1,60,120,60);
 box(400,1,300,0x5a5a62,0,-.5,0);box(400,.1,40,0x6ac85a,0,0,60);
 for(let i=0;i<8;i++){const h=20+rnd()*30;box(24,h,24,[0xd08a6a,0x8aa0c0,0xc0b08a][i%3],-120+i*34,h/2,-60);for(let y=6;y<h-4;y+=8)box(18,3,.3,0x9fd8ff,-120+i*34,y,-47.8)}
 // truck
 const t=new THREE.Group();S.add(t);
 const cab=new THREE.Mesh(new THREE.BoxGeometry(12,12,13),mat(0x3ddc84));cab.position.set(15,8,0);t.add(cab);
 const ws=new THREE.Mesh(new THREE.BoxGeometry(.3,5,11),mat(0x9fd8ff));ws.position.set(21.2,10,0);t.add(ws);
 const bed=new THREE.Mesh(new THREE.BoxGeometry(28,16,14),mat(0x2a9a5a));bed.position.set(-6,10,0);t.add(bed);
 const arm=new THREE.Mesh(new THREE.BoxGeometry(2,20,2),mat(0xffd23b));arm.position.set(8,20,8);arm.rotation.z=-.4;t.add(arm);
 for(const x of[-14,-2,15])for(const z of[-7,7]){const w=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,2,16),mat(0x111111));w.rotation.x=Math.PI/2;w.position.set(x,3.2,z);t.add(w)}
 t.position.set(10,0,0);t.rotation.y=-.35;
 // bin lifted + trash flying
 const bin=box(5,7,5,0x2e86ff,26,28,14);bin.rotation.z=2.4;
 for(let i=0;i<22;i++){const c=[0x8a6a4a,0xd0d0d0,0xff4d4d,0xffd23b,0x6ac85a,0x9b5cff][i%6];const b=box(1.4+rnd()*2,1.4+rnd()*2,1.4+rnd()*2,c,10+rnd()*20,20+rnd()*16,4+rnd()*10);b.rotation.set(rnd()*3,rnd()*3,rnd()*3)}
 // cash pop
 for(let i=0;i<10;i++)box(3,.2,1.6,0x3ddc84,-16+rnd()*24,32+rnd()*10,4,{emissive:0x20a040,emissiveIntensity:.5}).rotation.set(rnd(),rnd(),rnd());
 // bins on curb + worker
 for(let i=0;i<5;i++)box(4,6,4,[0x2e86ff,0x3ddc84,0x8a8a8a][i%3],44+i*8,3,24);
 const a=avatar(36,0,20,-.6,0xff8a1a,0x2a3a5a,'throw');a.scale.setScalar(1.7);
 cam.position.set(30,24,80);cam.lookAt(18,14,0);
}
if(id===2){ // tank scrub
 skyGrad('#0a3a5a','#1a6a8a');S.fog=null;
 S.add(new THREE.HemisphereLight(0xc0f0ff,0x103040,1.0));sun(0xc0f0ff,.8,0,120,40);
 box(300,1,200,0x3a4a5a,0,-.5,0);
 // giant tank glass
 box(140,70,4,0x5ad1ff,10,35,-30,{transparent:true,opacity:.18});
 const water=box(136,60,50,0x2aa0c8,10,30,-55,{transparent:true,opacity:.5});
 // gravel half clean half dirty
 for(let x=-56;x<76;x+=4)for(let z=-78;z<-32;z+=4){const dirty=x<10;box(4,1,4,dirty?0x4a5a2a:[0xf0d890,0xff8ad1,0x8ad0ff][(x+z)&1?0:((x/4|0)%3+3)%3],x,1,z)}
 // algae blobs on left
 for(let i=0;i<30;i++){const al=sph(2+rnd()*3,0x5a8a2a,-50+rnd()*56,4+rnd()*50,-31.5,{roughness:1});al.scale.z=.25};
 // fish on right
 const fish=(x,y,z,c,s)=>{const b=new THREE.Mesh(new THREE.SphereGeometry(2,12,10),mat(c,{emissive:c,emissiveIntensity:.25}));b.scale.set(1.6*s,1*s,.7*s);b.position.set(x,y,z);S.add(b);const tl=new THREE.Mesh(new THREE.ConeGeometry(1.6*s,2.4*s,4),mat(c));tl.rotation.z=Math.PI/2;tl.position.set(x-3.6*s,y,z);S.add(tl);sph(.4*s,0x111111,x+2*s,y+.5*s,z+1.2*s)};
 fish(40,30,-40,0xff8a1a,1.6);fish(56,44,-50,0xffd23b,1.2);fish(28,18,-46,0xff5ad1,1.3);fish(64,20,-44,0x5aff9a,1);
 // shark silhouette
 const sh=new THREE.Mesh(new THREE.SphereGeometry(5,14,10),mat(0x8aa0b0));sh.scale.set(3,1,1);sh.position.set(30,52,-62);S.add(sh);
 // bubbles
 for(let i=0;i<40;i++)sph(.4+rnd(),0xffffff,-50+rnd()*120,rnd()*60,-34-rnd()*4,{transparent:true,opacity:.5});
 // cleaners in diving suits
 const a=avatar(14,0,-6,-.3,0xffd23b,0x2a3a5a,'throw');a.scale.setScalar(2);sph(3.2,0x9fd8ff,14,15.5,-6,{transparent:true,opacity:.45});
 const sc=box(1,14,1,0x888888,8,14,-12);sc.rotation.z=.7;box(6,1.4,2,0x2e86ff,3,20,-18);
 const b=avatar(40,0,-2,-.5,0x3ddc84,0x2a3a5a,'cheer');b.scale.setScalar(1.8);
 cam.position.set(24,28,60);cam.lookAt(14,24,-40);
}
if(id===3){ // present tower
 skyGrad('#3a6ad0','#d8e8ff');S.fog=new THREE.Fog(0xd8e8ff,180,520);
 S.add(new THREE.HemisphereLight(0xffffff,0x9ab0c8,1.0));sun(0xffffff,1.1,40,120,60);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mat(0xf2f6ff));g.rotation.x=-Math.PI/2;S.add(g);
 const cols=[0xff4d4d,0x3ddc84,0x2e86ff,0xffd23b,0x9b5cff,0xff8a1a];
 const pres=(x,y,z,s,r,c)=>{const b=box(s,s*.8,s,c,x,y,z);b.rotation.set(0,r,0);const r1=box(s+.1,s*.8+.1,s*.18,0xffffff,x,y,z);r1.rotation.y=r;const r2=box(s*.18,s*.8+.1,s+.1,0xffffff,x,y,z);r2.rotation.y=r;return b};
 // tall tower (right), wobbling
 let y=3;for(let i=0;i<10;i++){const s=8-i*.35;pres(30+Math.sin(i*.8)*1.6,y,-4,s,i*.3,cols[i%6]);y+=s*.8}
 // short tower being hit (left)
 y=3;for(let i=0;i<5;i++){const s=8;pres(-6,y,-14,s,i*.4,cols[(i+3)%6]);y+=6.4}
 for(let i=0;i<3;i++){const b=pres(-2+i*5,26+i*5,-12,7,i,cols[i]);b.rotation.set(i*.6,i,i*.4)}
 // falling present from sky
 for(let i=0;i<4;i++){pres(-20+i*20,60+rnd()*14,-20,6,rnd()*3,cols[(i+1)%6]).rotation.x=rnd()}
 // snowballs
 for(let t=0;t<1;t+=.08)sph(.4,0xffffff,40-t*40,30+Math.sin(t*Math.PI)*8,10-t*20,{transparent:true,opacity:.6});sph(2.4,0xffffff,0,26,-10);
 const a=avatar(42,0,14,-.8,0xff4d4d,0x223355,'throw');a.scale.setScalar(1.8);
 const b=avatar(-18,0,4,.6,0x3ddc84,0x223355,'scared');b.scale.setScalar(1.8);
 const c=avatar(16,0,16,0,0x2e86ff,0x223355,'cheer');c.scale.setScalar(1.6);
 for(let i=0;i<8;i++)pine((rnd()<.5?-1:1)*(80+rnd()*60),-80-rnd()*80,2+rnd(),0x2f6b3a,true);
 cam.position.set(30,30,90);cam.lookAt(16,30,-6);
}
if(id===4){ // pillow brawl
 skyGrad('#2a1a5a','#5a3a8a');S.fog=null;
 S.add(new THREE.HemisphereLight(0xe0d0ff,0x302050,1.0));sun(0xfff0e0,.8,30,100,60);
 box(200,1,160,0xc8a0e8,0,-.5,0);box(200,60,1,0x7a5aaa,0,30,-50);
 // star wallpaper
 for(let i=0;i<30;i++)sph(.7,0xffe08a,-90+rnd()*180,10+rnd()*48,-49,{emissive:0xffd060,emissiveIntensity:.8});
 // beds / mattress
 for(const [x,c] of [[-50,0xff8ad1],[50,0x5ad1ff]]){box(30,6,40,0xffffff,x,3,-20);box(30,1,40,c,x,6.4,-20);box(12,4,8,0xffffff,x,8,-36)}
 // fairy lights
 for(let x=-90;x<=90;x+=6)sph(.8,[0xff5ad1,0xffd23b,0x5ad1ff][(x/6+15)%3|0],x,52-Math.abs(Math.sin(x/20))*4,-48,{emissive:[0xff2ad1,0xffb000,0x2ab0ff][(x/6+15)%3|0],emissiveIntensity:1.2});
 // fighters
 const pil=(x,y,z,rz,c)=>{const p=box(9,3,6,c,x,y,z);p.rotation.z=rz;return p};
 const a=avatar(-2,0,6,.5,0xffd23b,0x5a3a8a,'throw');a.scale.setScalar(2);pil(5,20,6,-.6,0xffffff);
 const b=avatar(24,14,0,0,0x3ddc84,0x8a3a5a,'scared');b.scale.setScalar(2);b.rotation.set(.3,-.5,1.3);
 const c=avatar(44,0,14,-.6,0xff5ad1,0x2a5a8a,'cheer');c.scale.setScalar(1.8);pil(40,16,14,.8,0xff8ad1);
 // feathers explosion
 for(let i=0;i<70;i++){const f=box(1.4,.2,.6,0xffffff,14+(rnd()-.5)*30,8+rnd()*30,(rnd()-.5)*20,{emissive:0xffffff,emissiveIntensity:.2});f.rotation.set(rnd()*3,rnd()*3,rnd()*3)}
 cam.position.set(26,22,64);cam.lookAt(18,14,-4);
}
if(id===5){ // topple
 skyGrad('#3a8bff','#e0f0ff');S.fog=new THREE.Fog(0xe0f0ff,180,520);
 S.add(new THREE.HemisphereLight(0xffffff,0x7a8a6a,1.0));sun(0xfff4e0,1.1,60,120,60);
 box(400,1,300,0x7ad86a,0,-.5,0);
 const cols=[0xff4d4d,0xffd23b,0x3ddc84,0x2e86ff,0x9b5cff,0xff8a1a];
 // spiral of dominoes, front fallen, back standing
 const N=140;for(let i=0;i<N;i++){const t=i/N;const a=t*Math.PI*5;const r=10+t*60;const x=20+Math.cos(a)*r,z=-20+Math.sin(a)*r*.7;const d=box(1,8,4,cols[(i/6|0)%6],x,4,z);d.rotation.y=-a;if(i>N-36){const k=(i-(N-36))/36;d.rotation.z=k*1.4;d.position.y=4-k*2}}
 // straight line toward camera
 for(let i=0;i<20;i++){const d=box(1.2,10,5,cols[i%6],-30+i*0,5,10+i*4);d.rotation.y=Math.PI/2;if(i<6){d.rotation.x=-1.2;d.position.y=2.4}}
 // ramp + bell + rocket
 const rp=box(16,1,10,0x8a6a4a,60,4,10);rp.rotation.z=.3;
 cyl(3,5,6,0xffd23b,70,14,-40,{metalness:.6,roughness:.3});box(1,10,1,0x666666,70,22,-40);
 const rk=cyl(1.6,1.6,10,0xffffff,-10,6,30);rk.rotation.z=1;
 // players
 const a=avatar(-36,0,82,.6,0xff4d4d,0x223355,'throw');a.scale.setScalar(1.8);
 const b=avatar(40,0,40,-.4,0x3ddc84,0x223355,'cheer');b.scale.setScalar(1.8);
 const c=avatar(0,0,40,0,0xffd23b,0x223355,'scared');c.scale.setScalar(1.6);
 cam.position.set(30,46,110);cam.lookAt(24,4,0);
}
R.render(S,cam);window.READY=true;
</script></body></html>
