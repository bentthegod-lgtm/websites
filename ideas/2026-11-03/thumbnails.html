<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Inter','DejaVu Sans',sans-serif}
#c{position:absolute;inset:0}
#ov{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;top:44px;left:56px;padding:14px 30px;border-radius:999px;font-weight:900;font-size:40px;letter-spacing:2px;color:#111;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.num{position:absolute;top:36px;right:56px;width:110px;height:110px;border-radius:50%;background:#fff;color:#111;font-weight:900;font-size:76px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.box{position:absolute;left:56px;bottom:52px;max-width:1180px}
.name{font-weight:900;font-size:150px;line-height:.95;color:#fff;letter-spacing:-2px;
 -webkit-text-stroke:10px #111;paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.45);margin-bottom:18px}
.hook{display:inline-block;font-weight:800;font-size:52px;color:#111;padding:10px 26px;border-radius:18px;margin-bottom:22px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.bul{font-weight:800;font-size:44px;color:#fff;line-height:1.28;-webkit-text-stroke:7px #111;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.bul span{display:inline-block;width:52px}
.shade{position:absolute;left:0;bottom:0;width:1400px;height:760px;background:radial-gradient(ellipse at 0% 100%,rgba(0,0,0,.62),rgba(0,0,0,0) 70%)}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ov"><div class="shade"></div><div class="tag" id="tag"></div><div class="num" id="num"></div>
<div class="box"><div class="name" id="name"></div><div class="hook" id="hook"></div><div class="bul" id="bul"></div></div></div>
<script src="three.min.js"></script>
<script>
const IDEAS={
1:{name:'OCEAN<br>SCRUB',hook:'Hook the trash. Save the sea. Get rich.',acc:'#5ad1ff',tag:'CLEANUP SIM',
 bul:['Fish up junk from boots to whole cars','Sell it, upgrade your boat and nets','Clean the ocean, free rare sea animals']},
2:{name:'LAVA<br>SURFERS',hook:'Surf the volcano. Don\'t fall in.',acc:'#ff7a1a',tag:'SURF RACE',
 bul:['Ride glowing lava waves down the mountain','Flip, grind and boost for points','Unlock fireproof boards and skins']},
3:{name:'STRIKE!',hook:'YOU are the bowling ball.',acc:'#ffd23b',tag:'RAGDOLL PARTY',
 bul:['Roll down crazy giant lanes','Smash ragdoll pins for points','Beat friends for the perfect strike']},
4:{name:'PAPER<br>ROUTE RUSH',hook:'Hit the porch. Dodge the dog!',acc:'#ff6b6b',tag:'DELIVERY RACE',
 bul:['Bike through town at full speed','Toss papers onto porches for combos','Break a window? Run!']},
5:{name:'POGO<br>PANIC',hook:'Bounce to the top. Don\'t wobble!',acc:'#b06bff',tag:'PARKOUR OBBY',
 bul:['Bounce up a giant tower with friends','Charge mega jumps, don\'t wobble','Race to the top for rare pogos']},
};
const id=+(new URLSearchParams(location.search).get('i')||1);const I=IDEAS[id];
document.getElementById('name').innerHTML=I.name;document.getElementById('hook').textContent=I.hook;
document.getElementById('hook').style.background=I.acc;document.getElementById('tag').textContent=I.tag;
document.getElementById('tag').style.background=I.acc;document.getElementById('num').textContent=id;
document.getElementById('bul').innerHTML=I.bul.map(b=>'<div><span>▶</span>'+b+'</div>').join('');

const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setSize(1920,1080,false);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();const cam=new THREE.PerspectiveCamera(50,1920/1080,0.1,2000);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0},o));
function box(w,h,d,c,x,y,z,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function sph(r,c,x,y,z,o){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function cyl(r1,r2,h,c,x,y,z,o){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,16),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
// blocky avatar; pose: 'run','cheer','throw','scared','sit'
function avatar(x,y,z,ry,shirt,pants,pose='run',skin=0xf5c542){
 const g=new THREE.Group();const P=(w,h,d,c,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(px,py,pz);m.castShadow=true;g.add(m);return m};
 P(2,2,1,shirt,0,3,0);const hd=P(1.2,1.2,1.2,skin,0,4.65,0);
 const e1=new THREE.Mesh(new THREE.BoxGeometry(.18,.28,.05),mat(0x111111));e1.position.set(-.25,4.75,.61);g.add(e1);const e2=e1.clone();e2.position.x=.25;g.add(e2);
 const mo=new THREE.Mesh(new THREE.BoxGeometry(pose==='scared'?.35:.5,pose==='scared'?.3:.1,.05),mat(0x111111));mo.position.set(0,4.35,.61);g.add(mo);
 const arm=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(skin));m.position.y=-.9;m.castShadow=true;a.add(m);a.position.set(s*1.5,3.9,0);g.add(a);return a};
 const leg=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(pants));m.position.y=-1;m.castShadow=true;a.add(m);a.position.set(s*.5,2,0);g.add(a);return a};
 const la=arm(-1),ra=arm(1),ll=leg(-1),rl=leg(1);
 if(pose==='run'){la.rotation.x=1;ra.rotation.x=-1;ll.rotation.x=-.7;rl.rotation.x=.7;g.rotation.x=.15}
 if(pose==='cheer'){la.rotation.z=-2.6;ra.rotation.z=2.6}
 if(pose==='throw'){ra.rotation.x=-2.6;la.rotation.x=.6;ll.rotation.x=-.4;rl.rotation.x=.4}
 if(pose==='scared'){la.rotation.x=-2.2;ra.rotation.x=-2.2;la.rotation.z=-.3;ra.rotation.z=.3}
 if(pose==='sit'){ll.rotation.x=-1.4;rl.rotation.x=-1.4;la.rotation.x=-1.0;ra.rotation.x=-1.0}
 g.position.set(x,y,z);g.rotation.y=ry;S.add(g);return g}
function sun(c,i,x,y,z){const d=new THREE.DirectionalLight(c,i);d.position.set(x,y,z);d.castShadow=true;d.shadow.mapSize.set(2048,2048);const s=d.shadow.camera;s.left=-120;s.right=120;s.top=120;s.bottom=-120;s.far=600;S.add(d);return d}
function skyGrad(top,bot){const cv=document.createElement('canvas');cv.width=2;cv.height=256;const x=cv.getContext('2d');const gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,top);gr.addColorStop(1,bot);x.fillStyle=gr;x.fillRect(0,0,2,256);S.background=new THREE.CanvasTexture(cv)}
function pine(x,z,s=1,c=0x2f6b3a,snow=false){cyl(.6*s,.8*s,3*s,0x6b4423,x,1.5*s,z);for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.ConeGeometry((4-i)*s,4*s,8),mat(c));m.position.set(x,(4+i*2.4)*s,z);m.castShadow=true;S.add(m);if(snow){const n=new THREE.Mesh(new THREE.ConeGeometry((2.6-i*.6)*s,2*s,8),mat(0xffffff));n.position.set(x,(5.2+i*2.4)*s,z);S.add(n)}}}
let seed=id*99;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;



function road(len,w,x,z,ry,c){const r=box(w,.4,len,c||0x3a3a44,x,.2,z);r.rotation.y=ry||0;for(let i=-len/2;i<len/2;i+=10){const d=box(.6,.42,5,0xffffff,0,0,0);S.remove(d);d.position.set(0,.01,i);r.add(d)}return r}


if(id===1){ // ocean scrub
 skyGrad('#2f86ff','#c6ecff');S.fog=new THREE.Fog(0xc6ecff,160,600);
 S.add(new THREE.HemisphereLight(0xffffff,0x2a6aa0,.95));sun(0xfff4e0,1.05,60,120,60);
 const sea=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200,60,60),mat(0x1d8ac4,{roughness:.25,metalness:.1,transparent:true,opacity:.85}));sea.rotation.x=-Math.PI/2;const sp=sea.geometry.attributes.position;for(let i=0;i<sp.count;i++)sp.setZ(i,Math.sin(sp.getX(i)*.05)*.8+Math.cos(sp.getY(i)*.06)*.8);sea.geometry.computeVertexNormals();S.add(sea);
 // boat
 const b=new THREE.Group();S.add(b);const B=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;b.add(m);return m};
 B(14,4,28,0xffffff,0,1.5,0);B(14.4,1,28.4,0xff4d4d,0,0,0);B(8,6,8,0x2e86ff,0,6,-6);B(7,2,.4,0x9fd8ff,0,7,-1.8);const crane=B(1,1,18,0xffd23b,4,10,6);crane.rotation.x=-.5;
 b.position.set(-10,0,0);b.rotation.y=.4;
 const a=avatar(0,0,0,0,0x3ddc84,0x223355,'cheer');S.remove(a);a.position.set(-3,3.5,6);b.add(a);
 // hooked car on line
 box(.3,30,.3,0x333333,6,16,24);const car=box(10,5,16,0xb03a3a,6,2,26);car.rotation.set(.4,.3,.2);box(8,3,8,0x9fd8ff,6,5.5,24);
 for(let i=0;i<6;i++)sph(.8,0xffffff,6+rnd()*6,4+rnd()*4,24+rnd()*8,{transparent:true,opacity:.7});
 // floating trash
 const junk=[[0x8a5a2b,2,1,3],[0x3ddc84,1.2,2.4,1.2],[0xffffff,1,1,1],[0xff4d4d,1.4,1.4,1.4],[0x333333,2.4,1.6,4]];
 for(let i=0;i<20;i++){const j=junk[i%5];const m=box(j[1],j[2],j[3],j[0],-60+rnd()*120,.4,-40+rnd()*90);m.rotation.set(rnd(),rnd(),rnd())}
 // dolphin + sea turtle
 const dol=new THREE.Mesh(new THREE.CapsuleGeometry?new THREE.SphereGeometry(4,16,12):new THREE.SphereGeometry(4,16,12),mat(0x8aa8c8));dol.scale.set(2.6,1,1);dol.position.set(40,6,-10);dol.rotation.z=.5;S.add(dol);
 const fin=new THREE.Mesh(new THREE.ConeGeometry(1.6,4,4),mat(0x8aa8c8));fin.position.set(40,10,-10);S.add(fin);
 cam.position.set(50,24,70);cam.lookAt(-4,6,4);
}
if(id===2){ // lava surf
 skyGrad('#2a0a0a','#a83a1a');S.fog=new THREE.Fog(0x6a2010,120,500);
 S.add(new THREE.HemisphereLight(0xff8a50,0x2a0a0a,.8));sun(0xffb070,.8,-40,100,80);
 const v=new THREE.Mesh(new THREE.ConeGeometry(220,200,10),mat(0x3a2a2a));v.position.set(0,0,-260);S.add(v);
 const cr=new THREE.Mesh(new THREE.CylinderGeometry(40,40,6,16),mat(0xff5a00,{emissive:0xff3a00,emissiveIntensity:1.5}));cr.position.set(0,100,-260);S.add(cr);
 for(let i=0;i<30;i++)sph(6+rnd()*10,0x555555,-30+rnd()*60,110+rnd()*40,-260,{transparent:true,opacity:.6});
 // lava river slope
 const lava=new THREE.Mesh(new THREE.PlaneGeometry(80,500,20,80),mat(0xff5a00,{emissive:0xff3a00,emissiveIntensity:1.2,roughness:.5}));lava.rotation.x=-Math.PI/2+.28;lava.position.set(0,40,-60);
 const lp=lava.geometry.attributes.position;for(let i=0;i<lp.count;i++)lp.setZ(i,Math.sin(lp.getY(i)*.08)*3+Math.sin(lp.getX(i)*.2)*1);lava.geometry.computeVertexNormals();S.add(lava);
 const ll=new THREE.PointLight(0xff6a20,2,200);ll.position.set(0,40,20);S.add(ll);
 for(let i=0;i<14;i++){const r=box(10+rnd()*12,8+rnd()*12,10+rnd()*12,0x2a2222,(rnd()<.5?-1:1)*(46+rnd()*30),20+rnd()*60,-200+rnd()*260)}
 const surfer=(x,y,z,c,rz,pose)=>{const bd=box(4,.6,10,0x2e86ff,x,y,z);bd.rotation.set(-.28,0,rz);const a=avatar(x,y+.4,z,0,c,0x222222,pose);a.rotation.set(-.28,1.2,rz)};
 surfer(-6,26,40,0xffd23b,.2,'cheer');surfer(14,40,-4,0x3ddc84,-.3,'run');surfer(-18,52,-50,0xff4d6d,.4,'scared');
 for(let i=0;i<20;i++)sph(.8,0xffd060,-6+rnd()*10,26+rnd()*10,40+rnd()*6,{emissive:0xffa020,emissiveIntensity:2});
 cam.position.set(16,36,66);cam.lookAt(-4,34,-8);
}
if(id===3){ // bowling
 skyGrad('#140a30','#3a1a6a');S.fog=new THREE.Fog(0x2a1250,120,420);
 S.add(new THREE.HemisphereLight(0xc0a0ff,0x1a0a2a,.95));sun(0xffffff,.7,30,100,60);
 const lane=box(40,2,260,0xd8a860,0,-1,-60);for(let x of[-22,22])box(4,3,260,0x333344,x,-1,-60);
 for(let i=-6;i<=6;i++)box(.4,2.02,260,0xc89850,i*3,-1,-60);
 for(let i=0;i<5;i++)box(1.4,.1,4,0xff4fa3,-8+i*4,.05,30);
 const bl=new THREE.PointLight(0xff4fa3,1.4,100);bl.position.set(-30,30,-120);S.add(bl);const bl2=new THREE.PointLight(0x4fc3ff,1.4,100);bl2.position.set(30,30,-120);S.add(bl2);
 // pins as ragdoll
 const pin=(x,z,rx,rz,fl)=>{const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(1.6,2.6,9,14),mat(0xffffff));b.position.y=4.5;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(1.8,14,10),mat(0xffffff));h.position.y=10;g.add(h);const st=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,.8,14),mat(0xff3030));st.position.y=8;g.add(st);
  const e1=new THREE.Mesh(new THREE.BoxGeometry(.4,.6,.1),mat(0x111111));e1.position.set(-.6,10.4,1.75);g.add(e1);const e2=e1.clone();e2.position.x=.6;g.add(e2);
  g.position.set(x,fl||0,z);g.rotation.set(rx,0,rz);S.add(g)};
 const rows=[[0],[-1,1],[-2,0,2],[-3,-1,1,3]];rows.forEach((r,ri)=>r.forEach(c=>{const x=c*4,z=-120-ri*7;const hit=ri<2;pin(x+(hit?rnd()*10-5:0),z,hit?rnd()*2:0,hit?rnd()*2-1:0,hit?4+rnd()*10:0)}));
 // ball w/ avatar
 const ball=new THREE.Mesh(new THREE.SphereGeometry(8,24,18),new THREE.MeshStandardMaterial({color:0x2e86ff,transparent:true,opacity:.6,roughness:.1}));ball.position.set(0,8,-84);S.add(ball);
 const a=avatar(0,2,-84,Math.PI,0xffd23b,0x222222,'scared');a.rotation.x=-.6;
 for(let i=0;i<8;i++)box(1,.2,5,0xffffff,0,.2,-74+i*6,{transparent:true,opacity:.5});
 cam.position.set(26,22,-30);cam.lookAt(-4,6,-110);
}
if(id===4){ // paper route
 skyGrad('#6ab8ff','#e8f6ff');S.fog=new THREE.Fog(0xe8f6ff,160,560);
 S.add(new THREE.HemisphereLight(0xffffff,0x80a060,.95));sun(0xfff4e0,1.05,60,120,40);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mat(0x6cc46c));g.rotation.x=-Math.PI/2;S.add(g);
 box(20,.4,400,0x4a4a54,0,.2,-80);box(4,.5,400,0xdddddd,-12,.25,-80);
 for(let i=0;i<7;i++){const z=-200+i*40;const c=[0xf0a878,0x96c8f0,0xf0dc8c,0xc8a0e6,0xa0dcaa][i%5];box(22,14,18,c,-34,7,z);const r=new THREE.Mesh(new THREE.ConeGeometry(17,8,4),mat(0x8a3a2a));r.rotation.y=Math.PI/4;r.position.set(-34,18,z);S.add(r);box(6,.6,4,0xb08a5a,-22,.4,z);box(4,6,.3,0x6a3a1a,-24.9,3,z);box(.3,3,1,0xffffff,-43,1.5,z+6);
  for(let x=-44;x<-24;x+=3)box(.5,2.5,.5,0xffffff,x,1.25,z+10)}
 // bike + rider
 const bk=new THREE.Group();S.add(bk);for(const z of[-3,3]){const w=new THREE.Mesh(new THREE.TorusGeometry(2,.4,8,20),mat(0x222222));w.rotation.y=Math.PI/2;w.position.set(0,2,z);bk.add(w)}
 const fr=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,6),mat(0xff4d4d));fr.position.set(0,3,0);bk.add(fr);const bag=new THREE.Mesh(new THREE.BoxGeometry(3,2.4,2.4),mat(0xd0c0a0));bag.position.set(0,4,-3);bk.add(bag);
 const a=avatar(0,0,0,0,0x2e86ff,0x223355,'throw');S.remove(a);a.position.set(0,2,0);a.rotation.y=Math.PI;bk.add(a);bk.position.set(2,0,10);bk.rotation.y=-.1;bk.scale.setScalar(1.6);
 // flying newspaper
 for(let i=0;i<3;i++){const p=box(2.4,1,1,0xf8f8f0,-6-i*5,8-i*1.5+Math.sin(i)*2,8-i*4);p.rotation.set(rnd(),rnd()*3,rnd())}
 // dog chasing
 box(5,3.4,3,0x7a5030,8,1.7,34);box(2.6,2.6,2.6,0x7a5030,8,4,31);
 // broken window sparkle
 for(let i=0;i<6;i++)box(.8,.8,.1,0x9fd8ff,-23+rnd()*2,8+rnd()*4,-40+rnd()*4);
 cam.position.set(30,16,46);cam.lookAt(-10,6,-10);
}
if(id===5){ // pogo
 skyGrad('#5a8cff','#ffd6f0');S.fog=new THREE.Fog(0xffd6f0,180,620);
 S.add(new THREE.HemisphereLight(0xffffff,0x8a7ad0,.95));sun(0xfff4e0,1.05,60,120,60);
 for(let i=0;i<28;i++){const a=i*.7,r=24,y=i*7;const p=box(12,2,10,[0xff4fa3,0x4fc3ff,0xffd23b,0x7aff7a,0xb06bff][i%5],Math.cos(a)*r,y,Math.sin(a)*r);p.rotation.y=-a}
 cyl(10,12,200,0xe8e0ff,0,100,0);
 const pogo=(x,y,z,c,tilt)=>{const g=new THREE.Group();const st=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,10,8),mat(0xff4d4d));st.position.y=5;g.add(st);const sp=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,2.4,10),mat(0xcccccc));sp.position.y=1.2;g.add(sp);const pd=new THREE.Mesh(new THREE.BoxGeometry(4,.4,1.2),mat(0x222222));pd.position.y=3;g.add(pd);
  const a=avatar(0,0,0,0,c,0x222222,'cheer');S.remove(a);a.position.set(0,3.2,0);g.add(a);g.position.set(x,y,z);g.rotation.z=tilt;S.add(g)};
 pogo(Math.cos(7*.7)*24,7*7+8,Math.sin(7*.7)*24,0x2e86ff,.1);pogo(Math.cos(9*.7)*24,9*7+14,Math.sin(9*.7)*24,0xffd23b,-.3);pogo(Math.cos(5*.7)*24+8,5*7+4,Math.sin(5*.7)*24+6,0x3ddc84,.7);
 const fall=avatar(30,22,30,0,0xff4d6d,0x333333,'scared');fall.rotation.set(1.2,0,.6);
 for(let i=0;i<6;i++)box(.3,2,.3,0xffffff,Math.cos(9*.7)*24,9*7+6-i*1.4,Math.sin(9*.7)*24,{transparent:true,opacity:.5});
 cam.position.set(60,60,90);cam.lookAt(0,52,0);
}
R.render(S,cam);window.READY=true;
</script></body></html>
