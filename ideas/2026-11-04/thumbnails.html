<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Inter','DejaVu Sans',sans-serif}
#c{position:absolute;inset:0}
#ov{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;top:44px;left:56px;padding:14px 30px;border-radius:999px;font-weight:900;font-size:40px;letter-spacing:2px;color:#111;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.num{position:absolute;top:36px;right:56px;width:110px;height:110px;border-radius:50%;background:#fff;color:#111;font-weight:900;font-size:76px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.box{position:absolute;left:56px;bottom:52px;max-width:1180px}
.name{font-weight:900;font-size:150px;line-height:.95;color:#fff;letter-spacing:-2px;
 -webkit-text-stroke:10px #111;paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.45);margin-bottom:18px}
.hook{display:inline-block;font-weight:800;font-size:52px;color:#111;padding:10px 26px;border-radius:18px;margin-bottom:22px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.bul{font-weight:800;font-size:44px;color:#fff;line-height:1.28;-webkit-text-stroke:7px #111;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.bul span{display:inline-block;width:52px}
.shade{position:absolute;left:0;bottom:0;width:1400px;height:760px;background:radial-gradient(ellipse at 0% 100%,rgba(0,0,0,.62),rgba(0,0,0,0) 70%)}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ov"><div class="shade"></div><div class="tag" id="tag"></div><div class="num" id="num"></div>
<div class="box"><div class="name" id="name"></div><div class="hook" id="hook"></div><div class="bul" id="bul"></div></div></div>
<script src="three.min.js"></script>
<script>
const IDEAS={
1:{name:'ZIPLINE<br>RUSH',hook:'+1 speed every ride. Don\'t let go!',acc:'#ffd23b',tag:'RACING',
 bul:['Race friends down giant ziplines','Jump between lines for shortcuts','Unlock faster handles and crazy routes']},
2:{name:'CHAOS<br>PUTT',hook:'Mini-golf... with rockets.',acc:'#7aff7a',tag:'PARTY GAME',
 bul:['Putt through wild obstacle holes','Use power-ups to mess up friends','Hole-in-one = instant bragging rights']},
3:{name:'PLANET<br>HOPPERS',hook:'Gravity boots on. Jump to the next planet!',acc:'#b06bff',tag:'SPACE PARKOUR',
 bul:['Run around tiny round planets','Leap through space between them','Collect stars, unlock new galaxies']},
4:{name:'KITE<br>WARS',hook:'Cut their string. Rule the sky.',acc:'#ff6b6b',tag:'SKY PVP',
 bul:['Fly your kite high over the city','Cross strings to cut rivals down','Build faster, sharper, crazier kites']},
5:{name:'SNOWPLOW<br>CITY',hook:'The blizzard hit. The city needs YOU.',acc:'#9fe0ff',tag:'WINTER SIM',
 bul:['Plow the streets before rush hour','Rescue buried cars and snowmen','Upgrade to a mega plow truck']},
};
const id=+(new URLSearchParams(location.search).get('i')||1);const I=IDEAS[id];
document.getElementById('name').innerHTML=I.name;document.getElementById('hook').textContent=I.hook;
document.getElementById('hook').style.background=I.acc;document.getElementById('tag').textContent=I.tag;
document.getElementById('tag').style.background=I.acc;document.getElementById('num').textContent=id;
document.getElementById('bul').innerHTML=I.bul.map(b=>'<div><span>▶</span>'+b+'</div>').join('');

const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setSize(1920,1080,false);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();const cam=new THREE.PerspectiveCamera(50,1920/1080,0.1,2000);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0},o));
function box(w,h,d,c,x,y,z,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function sph(r,c,x,y,z,o){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function cyl(r1,r2,h,c,x,y,z,o){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,16),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
// blocky avatar; pose: 'run','cheer','throw','scared','sit'
function avatar(x,y,z,ry,shirt,pants,pose='run',skin=0xf5c542){
 const g=new THREE.Group();const P=(w,h,d,c,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(px,py,pz);m.castShadow=true;g.add(m);return m};
 P(2,2,1,shirt,0,3,0);const hd=P(1.2,1.2,1.2,skin,0,4.65,0);
 const e1=new THREE.Mesh(new THREE.BoxGeometry(.18,.28,.05),mat(0x111111));e1.position.set(-.25,4.75,.61);g.add(e1);const e2=e1.clone();e2.position.x=.25;g.add(e2);
 const mo=new THREE.Mesh(new THREE.BoxGeometry(pose==='scared'?.35:.5,pose==='scared'?.3:.1,.05),mat(0x111111));mo.position.set(0,4.35,.61);g.add(mo);
 const arm=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(skin));m.position.y=-.9;m.castShadow=true;a.add(m);a.position.set(s*1.5,3.9,0);g.add(a);return a};
 const leg=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(pants));m.position.y=-1;m.castShadow=true;a.add(m);a.position.set(s*.5,2,0);g.add(a);return a};
 const la=arm(-1),ra=arm(1),ll=leg(-1),rl=leg(1);
 if(pose==='run'){la.rotation.x=1;ra.rotation.x=-1;ll.rotation.x=-.7;rl.rotation.x=.7;g.rotation.x=.15}
 if(pose==='cheer'){la.rotation.z=-2.6;ra.rotation.z=2.6}
 if(pose==='throw'){ra.rotation.x=-2.6;la.rotation.x=.6;ll.rotation.x=-.4;rl.rotation.x=.4}
 if(pose==='scared'){la.rotation.x=-2.2;ra.rotation.x=-2.2;la.rotation.z=-.3;ra.rotation.z=.3}
 if(pose==='sit'){ll.rotation.x=-1.4;rl.rotation.x=-1.4;la.rotation.x=-1.0;ra.rotation.x=-1.0}
 g.position.set(x,y,z);g.rotation.y=ry;S.add(g);return g}
function sun(c,i,x,y,z){const d=new THREE.DirectionalLight(c,i);d.position.set(x,y,z);d.castShadow=true;d.shadow.mapSize.set(2048,2048);const s=d.shadow.camera;s.left=-120;s.right=120;s.top=120;s.bottom=-120;s.far=600;S.add(d);return d}
function skyGrad(top,bot){const cv=document.createElement('canvas');cv.width=2;cv.height=256;const x=cv.getContext('2d');const gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,top);gr.addColorStop(1,bot);x.fillStyle=gr;x.fillRect(0,0,2,256);S.background=new THREE.CanvasTexture(cv)}
function pine(x,z,s=1,c=0x2f6b3a,snow=false){cyl(.6*s,.8*s,3*s,0x6b4423,x,1.5*s,z);for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.ConeGeometry((4-i)*s,4*s,8),mat(c));m.position.set(x,(4+i*2.4)*s,z);m.castShadow=true;S.add(m);if(snow){const n=new THREE.Mesh(new THREE.ConeGeometry((2.6-i*.6)*s,2*s,8),mat(0xffffff));n.position.set(x,(5.2+i*2.4)*s,z);S.add(n)}}}
let seed=id*99;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;



function road(len,w,x,z,ry,c){const r=box(w,.4,len,c||0x3a3a44,x,.2,z);r.rotation.y=ry||0;for(let i=-len/2;i<len/2;i+=10){const d=box(.6,.42,5,0xffffff,0,0,0);S.remove(d);d.position.set(0,.01,i);r.add(d)}return r}



if(id===1){ // zipline
 skyGrad('#2f86ff','#d6f0ff');S.fog=new THREE.Fog(0xd6f0ff,200,800);
 S.add(new THREE.HemisphereLight(0xffffff,0x5a8a5a,.95));sun(0xfff4e0,1.05,60,140,60);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),mat(0x4f9a4a));g.rotation.x=-Math.PI/2;S.add(g);
 for(let i=0;i<40;i++)pine(-300+rnd()*600,-300+rnd()*400,2+rnd(),0x2f6b3a);
 const m=new THREE.Mesh(new THREE.ConeGeometry(120,220,7),mat(0x8a8a9a));m.position.set(-120,110,-260);S.add(m);
 const line=(a,b,c)=>{const l=a.distanceTo(b);const mm=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,l,6),mat(c||0x333333));mm.position.copy(a.clone().add(b).multiplyScalar(.5));mm.lookAt(b);mm.rotateX(Math.PI/2);S.add(mm)};
 const lines=[[[-120,190,-240],[60,40,60]],[[-110,185,-250],[90,50,40]],[[-130,180,-230],[30,30,80]]];
 lines.forEach(l=>line(new THREE.Vector3(...l[0]),new THREE.Vector3(...l[1])));
 
 const rider=(t,li,c,p)=>{const a=new THREE.Vector3(...lines[li][0]),b=new THREE.Vector3(...lines[li][1]);const pos=a.clone().lerp(b,t);const av=avatar(pos.x,pos.y-12,pos.z,-.6,c,0x222222,p);av.scale.setScalar(3);box(.5,5,.5,0xff4d4d,pos.x,pos.y-2.5,pos.z)};
 rider(.78,0,0x2e86ff,'cheer');rider(.7,1,0xff4d6d,'scared');rider(.6,2,0x3ddc84,'cheer');
 for(let i=0;i<8;i++)box(.3,.3,6,0xffffff,40-i*4,60+i*3,30-i*5,{transparent:true,opacity:.5});
 cam.position.set(110,70,110);cam.lookAt(10,62,-20);
}
if(id===2){ // chaos putt
 skyGrad('#6ab8ff','#e0f6ff');S.fog=new THREE.Fog(0xe0f6ff,160,560);
 S.add(new THREE.HemisphereLight(0xffffff,0x60a060,.95));sun(0xfff4e0,1.05,60,120,40);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mat(0x9ad87a));g.rotation.x=-Math.PI/2;S.add(g);
 box(30,1,120,0x2fb04a,0,.5,-30);for(const x of[-16,16])box(2,3,120,0xffffff,x,1.5,-30);
 cyl(2,2,.2,0x111111,0,1.05,-80);box(.3,14,.3,0xffffff,0,8,-80);box(6,4,.2,0xff4d4d,3,13,-80);
 // windmill
 box(10,18,10,0xff9a3b,-8,10,-40);for(let i=0;i<4;i++){const b=box(2,20,.5,0xffffff,-8,16,-34.7);b.rotation.z=i*Math.PI/2+.3}
 // loop
 const tor=new THREE.Mesh(new THREE.TorusGeometry(10,1.2,10,30),mat(0x4fc3ff));tor.position.set(8,11,-10);tor.rotation.y=Math.PI/2;S.add(tor);
 // rocket ball, explosion
 sph(1.4,0xffffff,4,6,6);for(let i=0;i<8;i++)sph(.6+rnd(),0xff9a3b,4+rnd()*-3,6,8+i*1.6,{emissive:0xff6a00,emissiveIntensity:1.2});
 for(let i=0;i<10;i++)sph(2+rnd()*2,[0xffd23b,0xff4d4d,0xff9a3b][i%3],-6+rnd()*6,4+rnd()*6,-55+rnd()*6,{emissive:0xff6a00,emissiveIntensity:.8});
 // players
 const p1=avatar(-6,1,20,Math.PI,0x2e86ff,0x223355,'cheer');p1.scale.setScalar(1.4);box(.3,6,.3,0xcccccc,-3,4,18).rotation.z=.5;
 avatar(10,1,30,Math.PI+.5,0xff4d6d,0x333333,'scared').scale.setScalar(1.4);
 const fl=avatar(-2,14,-56,0,0xffd23b,0x222222,'scared');fl.rotation.set(1,.5,.8);
 cam.position.set(22,30,64);cam.lookAt(-2,4,-14);
}
if(id===3){ // planets
 skyGrad('#05041a','#2a1a5a');S.fog=null;
 S.add(new THREE.HemisphereLight(0xb0a0ff,0x100820,.9));sun(0xffffff,1.0,80,80,100);
 for(let i=0;i<300;i++){const st=new THREE.Mesh(new THREE.SphereGeometry(.4,4,3),new THREE.MeshBasicMaterial({color:0xffffff}));st.position.set(-400+rnd()*800,-200+rnd()*500,-400+rnd()*200);S.add(st)}
 const planet=(x,y,z,r,c,ring)=>{const p=sph(r,c,x,y,z);if(ring){const t=new THREE.Mesh(new THREE.TorusGeometry(r*1.6,r*.12,6,40),mat(0xffd23b));t.position.set(x,y,z);t.rotation.x=1.2;S.add(t)}
  return p};
 planet(-20,0,0,22,0x5ac85a);planet(60,40,-40,14,0xff9a3b,true);planet(-70,60,-80,12,0x4fc3ff);planet(30,-40,-60,10,0xd06bff);
 const a=avatar(-20,22,0,0,0x2e86ff,0x223355,'cheer');a.scale.setScalar(1.6);
 const j=avatar(18,22,-18,0,0xffd23b,0x222222,'run');j.scale.setScalar(1.6);j.rotation.z=-.8;
 for(let i=0;i<10;i++)sph(.6,0x9ad8ff,4+i*1.6,20+i*.4-i*i*.03,-6-i*1.4,{emissive:0x5ad1ff,emissiveIntensity:1});
 for(let i=0;i<6;i++){const st=new THREE.Mesh(new THREE.OctahedronGeometry(2),mat(0xffd23b,{emissive:0xffb000,emissiveIntensity:1}));st.position.set(-40+rnd()*100,-10+rnd()*80,-30+rnd()*20);S.add(st)}
 cam.position.set(30,30,80);cam.lookAt(0,20,-20);
}
if(id===4){ // kites
 skyGrad('#3a8bff','#ffe8c0');S.fog=new THREE.Fog(0xffe8c0,200,700);
 S.add(new THREE.HemisphereLight(0xffffff,0x8a7a5a,.95));sun(0xfff4e0,1.05,60,120,60);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),mat(0xb0a070));g.rotation.x=-Math.PI/2;S.add(g);
 for(let i=0;i<24;i++){const h=8+rnd()*14;const x=-120+(i%6)*40,z=-60-Math.floor(i/6)*34;box(30,h,26,[0xf0c890,0xe8a878,0xf5f5eb,0xc8d8f0][i%4],x,h/2,z);box(30.4,1,26.4,0xd0b080,x,h,z)}
 const kite=(x,y,z,c1,c2,rz,ox,oz)=>{const k=new THREE.Group();const s=new THREE.Mesh(new THREE.BoxGeometry(10,10,.3),mat(c1));s.rotation.z=Math.PI/4;k.add(s);const s2=new THREE.Mesh(new THREE.BoxGeometry(5,5,.35),mat(c2));s2.rotation.z=Math.PI/4;k.add(s2);
  for(let i=0;i<5;i++){const t=new THREE.Mesh(new THREE.BoxGeometry(1.2,.6,.2),mat(i%2?c1:c2));t.position.set(Math.sin(i)*1.5,-8-i*2.4,0);k.add(t)}k.position.set(x,y,z);k.rotation.set(0,-.4,rz);S.add(k);
  const a=new THREE.Vector3(x,y-6,z),b=new THREE.Vector3(ox,6,oz);const l=a.distanceTo(b);const m=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,l,4),mat(0xffffff));m.position.copy(a.clone().add(b).multiplyScalar(.5));m.lookAt(b);m.rotateX(Math.PI/2);S.add(m)};
 kite(-10,90,-20,0xff4d4d,0xffd23b,.2,-30,40);kite(20,80,-30,0x2e86ff,0xffffff,-.3,40,40);kite(5,104,-60,0x3ddc84,0xff4fa3,.5,10,-20);
 const cut=new THREE.Group();const cs=new THREE.Mesh(new THREE.BoxGeometry(9,9,.3),mat(0xb06bff));cs.rotation.z=Math.PI/4;cut.add(cs);cut.position.set(36,60,-10);cut.rotation.set(1,0,2);S.add(cut);
 for(let i=0;i<8;i++)sph(.5,0xffffff,8+rnd()*6,82+rnd()*6,-24+rnd()*4,{emissive:0xffffff,emissiveIntensity:1});
 avatar(-30,6,40,Math.PI+.3,0xff4d4d,0x333333,'cheer').scale.setScalar(1.5);avatar(40,6,40,Math.PI-.3,0x2e86ff,0x223355,'throw').scale.setScalar(1.5);
 cam.position.set(6,30,110);cam.lookAt(6,64,-20);
}
if(id===5){ // snowplow
 skyGrad('#8aa8c8','#e8f0f8');S.fog=new THREE.Fog(0xe8f0f8,90,420);
 S.add(new THREE.HemisphereLight(0xffffff,0x9ab0c8,1.0));sun(0xffffff,.7,40,100,60);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mat(0xf4f8ff));g.rotation.x=-Math.PI/2;S.add(g);
 box(30,.3,400,0x50505a,0,.15,-60);
 for(let i=0;i<10;i++){const z=-200+i*30;for(const s of[-1,1]){const h=20+rnd()*40;box(22,h,22,[0x9a6a5a,0x7a8a9a,0xc89a7a][i%3],s*38,h/2,z);box(22.4,2,22.4,0xffffff,s*38,h+1,z)}}
 for(let i=0;i<40;i++){const z=-180+rnd()*160;sph(3+rnd()*3,0xffffff,(rnd()-.5)*24,1,z)}
 for(let i=0;i<3;i++){box(8,5,14,[0xff4d4d,0x2e86ff,0x3ddc84][i],-8+i*9,2.5,-70-i*18);box(9,3,15,0xffffff,-8+i*9,5.5,-70-i*18)}
 const t=new THREE.Group();S.add(t);const T=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;t.add(m);return m};
 T(10,6,16,0xff9a1a,0,4,0);T(9,6,7,0xff9a1a,0,9,3);T(8,3,.3,0x9fd8ff,0,10,6.6);const bl=T(18,7,1.4,0xffd23b,0,3.5,10);bl.rotation.x=-.3;T(1,3,1,0xff2020,-3,13,3);T(1,3,1,0x2050ff,3,13,3);
 for(const [x,z] of [[-5,-5],[5,-5],[-5,5],[5,5]]){const w=cyl(2.2,2.2,1.6,0x222222,0,0,0);S.remove(w);w.rotation.z=Math.PI/2;w.position.set(x,2.2,z);t.add(w)}
 for(let i=0;i<20;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(1+rnd()*2,8,6),mat(0xffffff));s.position.set(-10+rnd()*20,4+rnd()*8,12+rnd()*6);t.add(s)}
 const a=avatar(0,0,0,0,0x2e86ff,0x223355,'cheer');S.remove(a);a.scale.setScalar(.7);a.position.set(0,6.5,2.5);t.add(a);
 t.position.set(2,0,20);t.rotation.y=Math.PI+.15;
 for(let i=0;i<300;i++)sph(.25,0xffffff,-60+rnd()*120,rnd()*60,-60+rnd()*120,{emissive:0xffffff,emissiveIntensity:.4});
 sph(5,0xffffff,24,5,30);sph(3.6,0xffffff,24,12,30);sph(2.6,0xffffff,24,17.5,30);
 cam.position.set(8,18,70);cam.lookAt(-2,7,0);
}
R.render(S,cam);window.READY=true;
</script></body></html>
