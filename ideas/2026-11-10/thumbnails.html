<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Inter','DejaVu Sans',sans-serif}
#c{position:absolute;inset:0}
#ov{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;top:44px;left:56px;padding:14px 30px;border-radius:999px;font-weight:900;font-size:40px;letter-spacing:2px;color:#111;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.num{position:absolute;top:36px;right:56px;width:110px;height:110px;border-radius:50%;background:#fff;color:#111;font-weight:900;font-size:76px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.box{position:absolute;left:56px;bottom:52px;max-width:1180px}
.name{font-weight:900;font-size:150px;line-height:.95;color:#fff;letter-spacing:-2px;
 -webkit-text-stroke:10px #111;paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.45);margin-bottom:18px}
.hook{display:inline-block;font-weight:800;font-size:52px;color:#111;padding:10px 26px;border-radius:18px;margin-bottom:22px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.bul{font-weight:800;font-size:44px;color:#fff;line-height:1.28;-webkit-text-stroke:7px #111;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.bul span{display:inline-block;width:52px}
.shade{position:absolute;left:0;bottom:0;width:1400px;height:760px;background:radial-gradient(ellipse at 0% 100%,rgba(0,0,0,.62),rgba(0,0,0,0) 70%)}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ov"><div class="shade"></div><div class="tag" id="tag"></div><div class="num" id="num"></div>
<div class="box"><div class="name" id="name"></div><div class="hook" id="hook"></div><div class="bul" id="bul"></div></div></div>
<script src="three.min.js"></script>
<script>
const IDEAS={
1:{name:'NICE<br>LIST',hook:'Who\'s the funniest? VOTE!',acc:'#ff9ad6',tag:'FRIENDS PARTY',
 bul:['Answer silly questions about each other','Vote, reveal, laugh','Earn badges, gift titles to friends']},
2:{name:'DING<br>DONG DASH',hook:'Knock. Run. Don\'t look back.',acc:'#ff6b4a',tag:'CHASE HORROR',
 bul:['Ring doorbells down a creepy street','Something always answers...','Escape to the end of the block']},
3:{name:'GAME<br>NIGHT',hook:'Classic board games. Ranked.',acc:'#ffd23b',tag:'BOARD GAME DUELS',
 bul:['Play classic board games 1v1','Climb the rankings, earn trophies','Giant boards, wild piece skins']},
4:{name:'QUIZ<br>CLASH',hook:'Answer fast. Wrong? Trapdoor!',acc:'#5ad1ff',tag:'TRIVIA PARTY',
 bul:['Game-show trivia with your friends','Wrong answers drop you in the slime pit','Last one standing wins the crown']},
5:{name:'PAWS &<br>PASTRIES',hook:'Run the cutest cafe in town.',acc:'#ffb86b',tag:'COZY TYCOON',
 bul:['Bake treats, serve customers','Adopt cats, dogs and bunnies to help','Decorate and grow your cafe empire']},
};
const id=+(new URLSearchParams(location.search).get('i')||1);const I=IDEAS[id];
document.getElementById('name').innerHTML=I.name;document.getElementById('hook').textContent=I.hook;
document.getElementById('hook').style.background=I.acc;document.getElementById('tag').textContent=I.tag;
document.getElementById('tag').style.background=I.acc;document.getElementById('num').textContent=id;
document.getElementById('bul').innerHTML=I.bul.map(b=>'<div><span>▶</span>'+b+'</div>').join('');

const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setSize(1920,1080,false);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();const cam=new THREE.PerspectiveCamera(50,1920/1080,0.1,2000);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0},o));
function box(w,h,d,c,x,y,z,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function sph(r,c,x,y,z,o){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function cyl(r1,r2,h,c,x,y,z,o){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,16),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
// blocky avatar; pose: 'run','cheer','throw','scared','sit'
function avatar(x,y,z,ry,shirt,pants,pose='run',skin=0xf5c542){
 const g=new THREE.Group();const P=(w,h,d,c,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(px,py,pz);m.castShadow=true;g.add(m);return m};
 P(2,2,1,shirt,0,3,0);const hd=P(1.2,1.2,1.2,skin,0,4.65,0);
 const e1=new THREE.Mesh(new THREE.BoxGeometry(.18,.28,.05),mat(0x111111));e1.position.set(-.25,4.75,.61);g.add(e1);const e2=e1.clone();e2.position.x=.25;g.add(e2);
 const mo=new THREE.Mesh(new THREE.BoxGeometry(pose==='scared'?.35:.5,pose==='scared'?.3:.1,.05),mat(0x111111));mo.position.set(0,4.35,.61);g.add(mo);
 const arm=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(skin));m.position.y=-.9;m.castShadow=true;a.add(m);a.position.set(s*1.5,3.9,0);g.add(a);return a};
 const leg=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(pants));m.position.y=-1;m.castShadow=true;a.add(m);a.position.set(s*.5,2,0);g.add(a);return a};
 const la=arm(-1),ra=arm(1),ll=leg(-1),rl=leg(1);
 if(pose==='run'){la.rotation.x=1;ra.rotation.x=-1;ll.rotation.x=-.7;rl.rotation.x=.7;g.rotation.x=.15}
 if(pose==='cheer'){la.rotation.z=-2.6;ra.rotation.z=2.6}
 if(pose==='throw'){ra.rotation.x=-2.6;la.rotation.x=.6;ll.rotation.x=-.4;rl.rotation.x=.4}
 if(pose==='scared'){la.rotation.x=-2.2;ra.rotation.x=-2.2;la.rotation.z=-.3;ra.rotation.z=.3}
 if(pose==='sit'){ll.rotation.x=-1.4;rl.rotation.x=-1.4;la.rotation.x=-1.0;ra.rotation.x=-1.0}
 g.position.set(x,y,z);g.rotation.y=ry;S.add(g);return g}
function sun(c,i,x,y,z){const d=new THREE.DirectionalLight(c,i);d.position.set(x,y,z);d.castShadow=true;d.shadow.mapSize.set(2048,2048);const s=d.shadow.camera;s.left=-120;s.right=120;s.top=120;s.bottom=-120;s.far=600;S.add(d);return d}
function skyGrad(top,bot){const cv=document.createElement('canvas');cv.width=2;cv.height=256;const x=cv.getContext('2d');const gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,top);gr.addColorStop(1,bot);x.fillStyle=gr;x.fillRect(0,0,2,256);S.background=new THREE.CanvasTexture(cv)}
function pine(x,z,s=1,c=0x2f6b3a,snow=false){cyl(.6*s,.8*s,3*s,0x6b4423,x,1.5*s,z);for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.ConeGeometry((4-i)*s,4*s,8),mat(c));m.position.set(x,(4+i*2.4)*s,z);m.castShadow=true;S.add(m);if(snow){const n=new THREE.Mesh(new THREE.ConeGeometry((2.6-i*.6)*s,2*s,8),mat(0xffffff));n.position.set(x,(5.2+i*2.4)*s,z);S.add(n)}}}
let seed=id*99;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;



function road(len,w,x,z,ry,c){const r=box(w,.4,len,c||0x3a3a44,x,.2,z);r.rotation.y=ry||0;for(let i=-len/2;i<len/2;i+=10){const d=box(.6,.42,5,0xffffff,0,0,0);S.remove(d);d.position.set(0,.01,i);r.add(d)}return r}







function figure(c){const a=avatar(0,0,0,0,c,0x222244,'cheer');S.remove(a);return a}


if(id===1){ // nice list
 skyGrad('#ffd8f0','#fff4e8');S.fog=null;
 S.add(new THREE.HemisphereLight(0xffffff,0xd0a0c0,1.1));sun(0xffffff,.9,40,120,80);
 box(200,1,140,0xf0e0ff,0,-.5,0);
 box(80,40,1,0xff9ad6,0,20,-40);box(70,12,.5,0xffffff,0,28,-39.2,{emissive:0xffffff,emissiveIntensity:.3});
 for(let i=0;i<5;i++){const x=-36+i*18;cyl(5,6,3,0xffd23b,x,1.5,0);const a=avatar(x,3,0,0,[0xff4d6d,0x2e86ff,0x3ddc84,0xb06bff,0xff9a3b][i],0x222244,i==2?'cheer':'scared');a.scale.setScalar(1.5)}
 // arrows pointing to player 3
 for(const x of[-36,-18,18,36]){const d=new THREE.Vector3(0-x,0,0).normalize();const a=new THREE.Mesh(new THREE.ConeGeometry(1.4,4,8),mat(0x3ddc84,{emissive:0x20c060,emissiveIntensity:.6}));a.position.set(x*.6,16,0);a.rotation.z=x<0?-Math.PI/2:Math.PI/2;S.add(a);box(Math.abs(x)*.4,1,1,0x3ddc84,x*.8,16,0,{emissive:0x20c060,emissiveIntensity:.6})}
 for(let i=0;i<12;i++){const h=new THREE.Mesh(new THREE.SphereGeometry(1.2,10,8),mat(0xff4d8a,{emissive:0xff2060,emissiveIntensity:.6}));h.position.set(-6+rnd()*12,14+rnd()*10,-2+rnd()*4);S.add(h)}
 const crown=cyl(2,2.4,2,0xffd23b,0,12,0,{emissive:0xffb000,emissiveIntensity:.5});
 cam.position.set(10,26,70);cam.lookAt(4,12,-4);
}
if(id===2){ // ding dong
 skyGrad('#060a1a','#1a2040');S.fog=new THREE.Fog(0x101830,40,240);
 S.add(new THREE.HemisphereLight(0x6a7ad0,0x0a0a14,.8));
 box(400,1,400,0x2a3a2a,0,-.5,0);box(20,.2,400,0x2a2a32,0,.05,0);box(4,.3,400,0x6a6a72,-12,.15,0);
 for(let i=0;i<6;i++){const z=-150+i*36;box(26,16,20,[0x4a3a3a,0x3a4a5a,0x4a4a3a][i%3],-30,8,z);const r=new THREE.Mesh(new THREE.ConeGeometry(20,10,4),mat(0x2a1a1a));r.rotation.y=Math.PI/4;r.position.set(-30,21,z);S.add(r);
  box(4,8,.4,0x2a1a0a,-16.8,4,z);if(i==3){box(4,8,.4,0x000000,-16.8,4,z+.2);sph(.4,0xff2020,-16.4,6.2,z+1,{emissive:0xff0000,emissiveIntensity:3});sph(.4,0xff2020,-16.4,6.2,z-.8,{emissive:0xff0000,emissiveIntensity:3})}else box(4,4,.4,0xffb050,-16.8,10,z+5,{emissive:0xff8a20,emissiveIntensity:i%2?1:.2})}
 const pl=new THREE.PointLight(0xff3030,1.4,30);pl.position.set(-14,6,-42);S.add(pl);
 for(let i=0;i<5;i++){box(.6,12,.6,0x222222,12,6,-140+i*60);sph(1.2,0xffe0a0,12,12,-140+i*60,{emissive:0xffc060,emissiveIntensity:i%2?1:.2})}
 // kids running
 const k1=avatar(4,0,-20,Math.PI-.2,0x2e86ff,0x223355,'run');k1.scale.setScalar(1.6);k1.rotation.y=Math.PI*0+.2;
 const k2=avatar(-6,0,-12,.3,0xff4d6d,0x333333,'scared');k2.scale.setScalar(1.6);
 // shadowy figure on porch
 const f=new THREE.Group();const F=(w,h,d,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(0x050505));m.position.set(x,y,z);f.add(m)};F(2.6,9,2,0,6,0);F(2,2,2,0,11.5,0);F(.8,8,.8,-1.8,6,0);F(.8,8,.8,1.8,6,0);f.position.set(-14,0,-42);f.rotation.y=Math.PI/2;S.add(f);
 cam.position.set(14,10,40);cam.lookAt(-10,6,-30);
}
if(id===3){ // game night
 skyGrad('#1a1a3a','#4a3a6a');S.fog=null;
 S.add(new THREE.HemisphereLight(0xfff0e0,0x2a1a3a,1.1));sun(0xfff0d0,1.0,40,120,60);
 box(300,1,300,0x5a3a2a,0,-.5,0);
 // giant checkerboard
 for(let x=0;x<8;x++)for(let z=0;z<8;z++)box(6,1,6,(x+z)%2?0x2a2a2a:0xf0e0c0,-48+x*6+3,.5,-24+z*6+3);
 for(let i=0;i<10;i++){const x=Math.floor(rnd()*8),z=Math.floor(rnd()*8);if((x+z)%2)cyl(2.4,2.4,1.4,i%2?0xff4d4d:0x2e2e3a,-48+x*6+3,1.7,-24+z*6+3)}
 // connect four
 box(30,26,3,0x2e6aff,30,13,-10);for(let c=0;c<7;c++)for(let r=0;r<6;r++){const filled=r<((c*3)%5);cyl(1.6,1.6,3.2,filled?(c+r)%2?0xff4d4d:0xffd23b:0x0a1a5a,18+c*4,3+r*4,-10).rotation.x=Math.PI/2}
 // battleship grid
 for(let x=0;x<6;x++)for(let z=0;z<6;z++)box(3.6,.4,3.6,0x2a7ad8,30+x*4,.3,14+z*4);box(14,3,3.4,0x8a8a9a,34,2,18);sph(1,0xff4d4d,42,1.5,26,{emissive:0xff2020,emissiveIntensity:1});
 const a=avatar(-20,1,10,Math.PI*.9,0xffd23b,0x222244,'cheer');a.scale.setScalar(1.6);const b=avatar(10,0,20,Math.PI+.4,0x3ddc84,0x222244,'scared');b.scale.setScalar(1.6);
 box(10,8,.4,0xffd23b,-36,22,-32,{emissive:0xffb000,emissiveIntensity:.4});
 cam.position.set(0,46,80);cam.lookAt(0,4,-6);
}
if(id===4){ // quiz clash
 skyGrad('#0a0a3a','#2a1a6a');S.fog=null;
 S.add(new THREE.HemisphereLight(0xe0d0ff,0x1a0a3a,1.0));sun(0xffffff,.8,30,120,80);
 box(200,1,140,0x2a1a4a,0,-.5,0);
 box(70,30,2,0x1a1a3a,0,24,-40);box(66,8,.4,0x5ad1ff,0,32,-38.8,{emissive:0x2a90ff,emissiveIntensity:.6});
 const ans=[0xff4d4d,0x2e86ff,0xffd23b,0x3ddc84];for(let i=0;i<4;i++)box(15,6,.4,ans[i],-24+i*16,18,-38.8,{emissive:ans[i],emissiveIntensity:.5});
 for(let i=0;i<5;i++){const x=-32+i*16;const open=i==3;if(!open){box(10,8,8,0xffd23b,x,4,0);const a=avatar(x,8,0,0,[0xff4d6d,0x2e86ff,0x3ddc84,0xb06bff,0xff9a3b][i],0x222244,'cheer');a.scale.setScalar(1.4)}else{box(10,1,8,0x3aff3a,x,-1,0,{emissive:0x20c020,emissiveIntensity:.6});const f=avatar(x,-2,0,0,0xb06bff,0x222244,'scared');f.scale.setScalar(1.4);f.rotation.z=.5;for(let k=0;k<10;k++)sph(1+rnd(),0x6aff3a,x-4+rnd()*8,rnd()*6,-3+rnd()*6,{emissive:0x3acc10,emissiveIntensity:.5})}}
 for(let i=0;i<12;i++){const l=new THREE.SpotLight([0xff4fa3,0x4fc3ff,0xffd23b][i%3],1.2,200,.25,.5,1);l.position.set(-60+i*11,60,20);l.target.position.set(-30+i*5,0,0);S.add(l);S.add(l.target)}
 cam.position.set(10,30,70);cam.lookAt(0,12,-10);
}
if(id===5){ // paws & pastries
 skyGrad('#ffe8d0','#fff6ea');S.fog=null;
 S.add(new THREE.HemisphereLight(0xffffff,0xd0b090,1.1));sun(0xfff4e0,1.0,40,120,60);
 box(200,1,140,0xd8b890,0,-.5,0);for(let x=-90;x<100;x+=10)box(.4,1.02,140,0xc8a880,x,-.5,0);
 box(120,40,1,0xffd0d8,0,20,-40);for(const x of[-30,30])box(16,14,.4,0xbfe8ff,x,24,-39.2);
 // counter + display
 box(50,10,10,0xffffff,0,5,-20);box(50,1,10,0xff9ad6,0,10.5,-20);box(40,6,8,0x9fd8ff,0,14,-20,{transparent:true,opacity:.35});
 for(let i=0;i<8;i++){cyl(1.6,1.6,1.4,[0xd99a50,0xff9ad6,0xffd23b,0x8a5a2b][i%4],-16+i*4.6,12,-20);sph(.6,0xff4d4d,-16+i*4.6,13.2,-20)}
 // tables, pets
 for(const [x,z] of [[-30,14],[30,16]]){cyl(6,6,.6,0xffffff,x,6,z);box(.8,6,.8,0x8a5a2b,x,3,z)}
 const cat=(x,z,c)=>{const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(2.4,14,10),mat(c));b.scale.set(1.2,.9,1);b.position.y=2.2;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(1.8,14,10),mat(c));h.position.set(0,4.4,1.6);g.add(h);for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.ConeGeometry(.6,1.4,4),mat(c));e.position.set(s*.9,6,1.6);g.add(e);const ey=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),mat(0x111111));ey.position.set(s*.6,4.7,3.2);g.add(ey)}
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,4,6),mat(c));t.position.set(0,3,-2.6);t.rotation.x=.7;g.add(t);g.position.set(x,0,z);g.scale.setScalar(1.4);S.add(g)};
 cat(-30,24,0xf0a040);cat(-10,8,0xffffff);cat(34,26,0x8a8a9a);
 const dog=new THREE.Group();const db=new THREE.Mesh(new THREE.BoxGeometry(4,3,6),mat(0xc89a6a));db.position.y=2.6;dog.add(db);const dh=new THREE.Mesh(new THREE.BoxGeometry(3,3,3),mat(0xc89a6a));dh.position.set(0,4.4,3.6);dog.add(dh);dog.position.set(14,0,10);dog.scale.setScalar(1.4);S.add(dog);
 const chef=avatar(0,0,-28,0,0xffffff,0x333333,'cheer');chef.scale.setScalar(1.4);const hat=cyl(1.4,1.6,3,0xffffff,0,0,0);S.remove(hat);hat.position.set(0,6.4,0);chef.add(hat);
 avatar(-20,0,28,Math.PI*.8,0xff4d6d,0x333333,'cheer').scale.setScalar(1.4);
 cam.position.set(20,30,74);cam.lookAt(-4,8,-6);
}
R.render(S,cam);window.READY=true;
</script></body></html>
