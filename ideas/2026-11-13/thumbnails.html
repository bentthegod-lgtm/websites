<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Inter','DejaVu Sans',sans-serif}
#c{position:absolute;inset:0}
#ov{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;top:44px;left:56px;padding:14px 30px;border-radius:999px;font-weight:900;font-size:40px;letter-spacing:2px;color:#111;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.num{position:absolute;top:36px;right:56px;width:110px;height:110px;border-radius:50%;background:#fff;color:#111;font-weight:900;font-size:76px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.box{position:absolute;left:56px;bottom:52px;max-width:1180px}
.name{font-weight:900;font-size:150px;line-height:.95;color:#fff;letter-spacing:-2px;
 -webkit-text-stroke:10px #111;paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.45);margin-bottom:18px}
.hook{display:inline-block;font-weight:800;font-size:52px;color:#111;padding:10px 26px;border-radius:18px;margin-bottom:22px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.bul{font-weight:800;font-size:44px;color:#fff;line-height:1.28;-webkit-text-stroke:7px #111;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.bul span{display:inline-block;width:52px}
.shade{position:absolute;left:0;bottom:0;width:1400px;height:760px;background:radial-gradient(ellipse at 0% 100%,rgba(0,0,0,.62),rgba(0,0,0,0) 70%)}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ov"><div class="shade"></div><div class="tag" id="tag"></div><div class="num" id="num"></div>
<div class="box"><div class="name" id="name"></div><div class="hook" id="hook"></div><div class="bul" id="bul"></div></div></div>
<script src="three.min.js"></script>
<script>
const IDEAS={
1:{name:'SNOW<br>WALL',hook:'Build the wall. The avalanche is coming.',acc:'#bfe8ff',tag:'BUILD & DEFEND',
 bul:['Shovel snow, stack ice blocks, dig trenches','Survive bigger avalanches each wave','Protect the village, upgrade your plow']},
2:{name:'FLOPPY<br>HOCKEY',hook:'Ragdoll hockey. Nobody can stand up.',acc:'#5ad1ff',tag:'RAGDOLL SPORT',
 bul:['4v4 hockey with wobbly physics','Body-check, slide and flop to score','Join a club, climb the league']},
3:{name:'DUNK<br>FLOP',hook:'Ragdoll basketball. Dunk or faceplant.',acc:'#ff9a3b',tag:'RAGDOLL SPORT',
 bul:['3v3 street ball with floppy players','Launch off trampolines for mega dunks','Rare jerseys, crazy courts']},
4:{name:'TRUCK<br>FLIP',hook:'Giant tires. Giant jumps. Land it!',acc:'#ff4d4d',tag:'STUNT ARENA',
 bul:['Backflips, wheelies and car crushing','Score combos in the freestyle arena','Build and paint your monster truck']},
5:{name:'BEEP BEEP<br>BEACH',hook:'Beep... beep... BEEEEP! Dig it up!',acc:'#ffd23b',tag:'TREASURE HUNT',
 bul:['Sweep the sand with your metal detector','Dig up coins, rings, pirate gold','Rare finds go in your museum']},
};
const id=+(new URLSearchParams(location.search).get('i')||1);const I=IDEAS[id];
document.getElementById('name').innerHTML=I.name;document.getElementById('hook').textContent=I.hook;
document.getElementById('hook').style.background=I.acc;document.getElementById('tag').textContent=I.tag;
document.getElementById('tag').style.background=I.acc;document.getElementById('num').textContent=id;
document.getElementById('bul').innerHTML=I.bul.map(b=>'<div><span>▶</span>'+b+'</div>').join('');

const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
R.setSize(1920,1080,false);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();const cam=new THREE.PerspectiveCamera(50,1920/1080,0.1,2000);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0},o));
function box(w,h,d,c,x,y,z,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function sph(r,c,x,y,z,o){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
function cyl(r1,r2,h,c,x,y,z,o){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,16),c.isMaterial?c:mat(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;S.add(m);return m}
// blocky avatar; pose: 'run','cheer','throw','scared','sit'
function avatar(x,y,z,ry,shirt,pants,pose='run',skin=0xf5c542){
 const g=new THREE.Group();const P=(w,h,d,c,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(px,py,pz);m.castShadow=true;g.add(m);return m};
 P(2,2,1,shirt,0,3,0);const hd=P(1.2,1.2,1.2,skin,0,4.65,0);
 const e1=new THREE.Mesh(new THREE.BoxGeometry(.18,.28,.05),mat(0x111111));e1.position.set(-.25,4.75,.61);g.add(e1);const e2=e1.clone();e2.position.x=.25;g.add(e2);
 const mo=new THREE.Mesh(new THREE.BoxGeometry(pose==='scared'?.35:.5,pose==='scared'?.3:.1,.05),mat(0x111111));mo.position.set(0,4.35,.61);g.add(mo);
 const arm=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(skin));m.position.y=-.9;m.castShadow=true;a.add(m);a.position.set(s*1.5,3.9,0);g.add(a);return a};
 const leg=(s)=>{const a=new THREE.Group();const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),mat(pants));m.position.y=-1;m.castShadow=true;a.add(m);a.position.set(s*.5,2,0);g.add(a);return a};
 const la=arm(-1),ra=arm(1),ll=leg(-1),rl=leg(1);
 if(pose==='run'){la.rotation.x=1;ra.rotation.x=-1;ll.rotation.x=-.7;rl.rotation.x=.7;g.rotation.x=.15}
 if(pose==='cheer'){la.rotation.z=-2.6;ra.rotation.z=2.6}
 if(pose==='throw'){ra.rotation.x=-2.6;la.rotation.x=.6;ll.rotation.x=-.4;rl.rotation.x=.4}
 if(pose==='scared'){la.rotation.x=-2.2;ra.rotation.x=-2.2;la.rotation.z=-.3;ra.rotation.z=.3}
 if(pose==='sit'){ll.rotation.x=-1.4;rl.rotation.x=-1.4;la.rotation.x=-1.0;ra.rotation.x=-1.0}
 g.position.set(x,y,z);g.rotation.y=ry;S.add(g);return g}
function sun(c,i,x,y,z){const d=new THREE.DirectionalLight(c,i);d.position.set(x,y,z);d.castShadow=true;d.shadow.mapSize.set(2048,2048);const s=d.shadow.camera;s.left=-120;s.right=120;s.top=120;s.bottom=-120;s.far=600;S.add(d);return d}
function skyGrad(top,bot){const cv=document.createElement('canvas');cv.width=2;cv.height=256;const x=cv.getContext('2d');const gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,top);gr.addColorStop(1,bot);x.fillStyle=gr;x.fillRect(0,0,2,256);S.background=new THREE.CanvasTexture(cv)}
function pine(x,z,s=1,c=0x2f6b3a,snow=false){cyl(.6*s,.8*s,3*s,0x6b4423,x,1.5*s,z);for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.ConeGeometry((4-i)*s,4*s,8),mat(c));m.position.set(x,(4+i*2.4)*s,z);m.castShadow=true;S.add(m);if(snow){const n=new THREE.Mesh(new THREE.ConeGeometry((2.6-i*.6)*s,2*s,8),mat(0xffffff));n.position.set(x,(5.2+i*2.4)*s,z);S.add(n)}}}
let seed=id*99;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;



function road(len,w,x,z,ry,c){const r=box(w,.4,len,c||0x3a3a44,x,.2,z);r.rotation.y=ry||0;for(let i=-len/2;i<len/2;i+=10){const d=box(.6,.42,5,0xffffff,0,0,0);S.remove(d);d.position.set(0,.01,i);r.add(d)}return r}







function figure(c){const a=avatar(0,0,0,0,c,0x222244,'cheer');S.remove(a);return a}





if(id===1){ // snow wall
 skyGrad('#4a8bd8','#e0f0ff');S.fog=new THREE.Fog(0xe0f0ff,150,560);
 S.add(new THREE.HemisphereLight(0xffffff,0x9ab0c8,1.0));sun(0xffffff,1.0,40,120,60);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mat(0xf4f8ff));g.rotation.x=-Math.PI/2;S.add(g);
 const m=new THREE.Mesh(new THREE.ConeGeometry(200,220,8),mat(0xe8f0ff));m.position.set(0,90,-300);S.add(m);
 // avalanche wave
 for(let i=0;i<60;i++){const x=-140+rnd()*280,z=-110-rnd()*30,r=10+rnd()*14;sph(r,0xffffff,x,r*.6+rnd()*14,z,{roughness:1})}
 // wall
 for(let x=-60;x<=60;x+=6)for(let y=0;y<3;y++)box(5.6,4,4,y==2?0xbfe8ff:0xe8f6ff,x,2+y*4,-40,y==2?{transparent:true,opacity:.85,emissive:0x5ab0e0,emissiveIntensity:.2}:{});
 box(130,.5,8,0x9ab0c8,0,.2,-46);
 // village
 for(let i=0;i<5;i++){const x=-50+i*25;box(14,10,12,[0x8a5a4a,0x5a6a8a,0x7a5a3a][i%3],x,5,20);const r=new THREE.Mesh(new THREE.ConeGeometry(11,7,4),mat(0xffffff));r.rotation.y=Math.PI/4;r.position.set(x,13.5,20);S.add(r);box(3,3,.3,0xffb050,x,5,26.2,{emissive:0xff8a20,emissiveIntensity:.7})}
 const a=avatar(-14,0,-30,0,0xff4d4d,0x223355,'throw');a.scale.setScalar(1.5);box(.4,6,.4,0x8a5a2b,-11,6,-30).rotation.z=.6;
 const b=avatar(14,12,-40,0,0x2e86ff,0x223355,'cheer');b.scale.setScalar(1.4);
 for(let i=0;i<100;i++)sph(.3,0xffffff,-80+rnd()*160,rnd()*50,-120+rnd()*100,{emissive:0xffffff,emissiveIntensity:.4});
 cam.position.set(30,24,70);cam.lookAt(-4,10,-50);
}
if(id===2){ // floppy hockey
 skyGrad('#0a1a3a','#2a4a8a');S.fog=null;
 S.add(new THREE.HemisphereLight(0xe0f0ff,0x2a3a5a,1.1));sun(0xffffff,.9,30,120,60);
 box(160,1,90,0xeaf6ff,0,-.5,0);box(160,.06,1,0xff2020,0,.02,0);for(const x of[-80,80])box(1,6,90,0xffffff,x,3,0);for(const z of[-45,45])box(160,6,1,0xffffff,0,3,z);
 box(.6,6,12,0xff2020,62,3,0);box(6,.6,12,0xff2020,65,6,0);box(.2,5.4,11,0xffffff,67.8,3,0,{transparent:true,opacity:.4});
 cyl(1.4,1.4,.8,0x111111,40,.8,-2);
 const flop=(x,z,c,rx,rz,y)=>{const a=avatar(x,y||0,z,rnd()*6,c,0x222244,'scared');a.scale.setScalar(1.8);a.rotation.set(rx,rnd()*6,rz)};
 flop(10,6,0x2e86ff,1.4,.3,1);flop(30,-10,0xff4d4d,.3,1.2,2);flop(-6,-14,0x2e86ff,-.6,.4);flop(50,4,0xff4d4d,0,-.2,5);flop(20,16,0xff4d4d,1.5,0,.6);
 const g=avatar(66,0,0,-Math.PI/2,0xff4d4d,0x333333,'scared');g.scale.setScalar(1.7);g.rotation.z=.8;
 for(let i=0;i<20;i++)sph(.4,0xffffff,20+rnd()*30,1,-10+rnd()*20,{transparent:true,opacity:.6});
 cam.position.set(-10,34,60);cam.lookAt(26,2,-2);
}
if(id===3){ // dunk flop
 skyGrad('#ff9a5a','#ffe0b0');S.fog=null;
 S.add(new THREE.HemisphereLight(0xffe6c0,0x6a4a3a,1.0));sun(0xffd6a0,1.1,-60,80,60);
 box(160,1,90,0xd88a4a,0,-.5,0);for(const z of[-45,45])box(160,.2,1,0xffffff,0,.1,z);const ar=new THREE.Mesh(new THREE.TorusGeometry(16,.4,6,40,Math.PI),mat(0xffffff));ar.rotation.x=-Math.PI/2;ar.position.set(64,.15,0);ar.rotation.z=Math.PI/2;S.add(ar);
 box(1.4,26,1.4,0x333333,76,13,0);box(1,10,14,0xffffff,72,26,0,{transparent:true,opacity:.8});const rim=new THREE.Mesh(new THREE.TorusGeometry(2.6,.25,6,20),mat(0xff7a1a));rim.rotation.x=Math.PI/2;rim.position.set(68.5,23,0);S.add(rim);
 cyl(6,6,1.4,0x2e86ff,40,.7,0);
 // dunker mid-air
 const d=avatar(58,22,0,-Math.PI/2,0xffd23b,0x222244,'cheer');d.scale.setScalar(1.8);d.rotation.set(0,-Math.PI/2,-.8);
 sph(1.4,0xff7a1a,64,30,0);
 for(let t=0;t<1;t+=.08)sph(.4,0xffffff,40+t*18,2+Math.sin(t*Math.PI)*30,0,{transparent:true,opacity:.5});
 const f=avatar(20,1,10,0,0xff4d4d,0x333333,'scared');f.scale.setScalar(1.8);f.rotation.set(1.4,0,.4);
 const f2=avatar(30,0,-14,0,0x3ddc84,0x333333,'run');f2.scale.setScalar(1.8);f2.rotation.z=-.9;
 for(let i=0;i<8;i++)box(4,14,4,[0xf0a878,0xc8a0e6,0x96c8f0][i%3],-80+i*20,7,-60);
 cam.position.set(10,30,70);cam.lookAt(44,14,0);
}
if(id===4){ // truck flip
 skyGrad('#3a8bff','#d6f0ff');S.fog=new THREE.Fog(0xd6f0ff,160,500);
 S.add(new THREE.HemisphereLight(0xffffff,0x8a6a4a,1.0));sun(0xfff4e0,1.1,60,120,60);
 box(300,1,200,0x8a6a4a,0,-.5,0);
 // ramps
 const r1=box(30,2,24,0x6a4a3a,-30,6,0);r1.rotation.z=.4;const r2=box(30,2,24,0x6a4a3a,50,6,0);r2.rotation.z=-.4;
 // crushed cars
 for(let i=0;i<4;i++){box(12,3,7,[0xff4d4d,0x2e86ff,0x3ddc84,0xffd23b][i],10+i*13,1.5,24);box(10,1.4,6.4,0x9fd8ff,10+i*13,3.4,24)}
 // monster truck mid-flip
 const t=new THREE.Group();S.add(t);const body=new THREE.Mesh(new THREE.BoxGeometry(16,6,9),mat(0x9b5cff));body.position.y=6;t.add(body);const cab=new THREE.Mesh(new THREE.BoxGeometry(7,4,8),mat(0x9b5cff));cab.position.set(-2,10.5,0);t.add(cab);
 const fl=new THREE.Mesh(new THREE.BoxGeometry(8,.4,9.2),mat(0xffd23b,{emissive:0xff8000,emissiveIntensity:.5}));fl.position.set(3,6,0);t.add(fl);
 for(const x of[-6,6])for(const z of[-6,6]){const w=new THREE.Mesh(new THREE.CylinderGeometry(4.4,4.4,3.4,16),mat(0x1a1a1a));w.rotation.x=Math.PI/2;w.position.set(x,2,z);t.add(w)}
 const dr=avatar(0,0,0,0,0x3ddc84,0x223355,'cheer');S.remove(dr);dr.scale.setScalar(.7);dr.position.set(-2,9,0);t.add(dr);
 t.position.set(10,36,0);t.rotation.z=2.2;
 for(let t2=0;t2<1;t2+=.07)sph(.6,0xffffff,-20+t2*60,10+Math.sin(t2*Math.PI)*32,0,{transparent:true,opacity:.5});
 // crowd stands
 for(let i=0;i<5;i++)box(40,4,6,0x5a5a6a,-80+i*40,2+i*0,-50);for(let i=0;i<20;i++)avatar(-90+i*9,4,-50,0,[0xff4d4d,0x2e86ff,0xffd23b,0x3ddc84][i%4],0x222222,'cheer');
 cam.position.set(20,24,90);cam.lookAt(12,24,0);
}
if(id===5){ // beep beep beach
 skyGrad('#3aa0ff','#d6f0ff');S.fog=new THREE.Fog(0xd6f0ff,160,560);
 S.add(new THREE.HemisphereLight(0xffffff,0xc8b080,1.0));sun(0xfff4e0,1.1,60,120,60);
 box(400,2,200,0xf0d890,0,-1,0);const sea=new THREE.Mesh(new THREE.PlaneGeometry(800,300),mat(0x1d8ac4,{roughness:.2,transparent:true,opacity:.9}));sea.rotation.x=-Math.PI/2;sea.position.set(0,.3,-180);S.add(sea);
 for(let i=0;i<4;i++){const p=new THREE.Group();const tr=cyl(1,1.4,24,0x8a6a3a,0,0,0);S.remove(tr);tr.position.y=12;p.add(tr);for(let k=0;k<6;k++){const l=new THREE.Mesh(new THREE.BoxGeometry(1,.3,12),mat(0x3ddc84));l.position.set(0,24,0);l.rotation.y=k;l.rotation.x=-.3;l.translateZ(5);p.add(l)}p.position.set(-80+i*50,0,40-rnd()*20);S.add(p)}
 // detector person
 const a=avatar(0,0,10,-.4,0xff9a3b,0x2a4a8a,'throw');a.scale.setScalar(1.6);
 const det=box(.4,.4,10,0x8a8a9a,4,4,6);det.rotation.x=.6;cyl(2,2,.4,0x333333,6,.8,1);
 // beep waves
 for(let i=1;i<4;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(2+i*2,.25,6,30),mat(0xffd23b,{emissive:0xffb000,emissiveIntensity:1}));r.rotation.x=Math.PI/2;r.position.set(6,1+i*.3,1);S.add(r)}
 // dug treasure
 cyl(6,6,.6,0xc8a060,-20,.2,0);const chest=box(8,5,5,0x8a5a2b,-20,2.5,0);box(8.2,1,5.2,0xffd23b,-20,4.6,0);
 for(let i=0;i<14;i++)cyl(1,1,.3,0xffd23b,-22+rnd()*8,5+rnd()*3,rnd()*4-2,{emissive:0xffa000,emissiveIntensity:.6});
 const b=avatar(-30,0,8,1.2,0x3ddc84,0x223355,'cheer');b.scale.setScalar(1.5);
 box(.4,.4,10,0x8a5a2b,-26,4,8).rotation.z=.7;
 cam.position.set(20,24,60);cam.lookAt(-8,4,-4);
}
R.render(S,cam);window.READY=true;
</script></body></html>
